<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/moonlight.svg" />
    <meta name="theme-color" content="#172237" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MoonLight — Your local Bitcoin map</title>
  </head>
  <body>
    <div id="root">
      <div role="status" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f7f8fa;color:#172237;font:14px system-ui,sans-serif;text-align:center;padding:24px">
        <span id="startup-message">Opening MoonLight…</span>
        <button id="startup-retry" hidden style="padding:10px 18px;border:1px solid #d1d2d9;border-radius:10px;background:white;color:inherit" onclick="location.reload()">Try again</button>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var message = document.getElementById('startup-message');
        var retry = document.getElementById('startup-retry');
        if (message && retry) {
          message.textContent = 'Opening is taking longer than expected. Please try again.';
          retry.hidden = false;
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
